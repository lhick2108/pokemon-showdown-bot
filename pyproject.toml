[project]
name = "showdown-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "poke-env>=0.16.1",
]

[project.scripts]
showdown-bot = "showdown_bot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Value-net training (src/showdown_bot/train.py). Not installed by default:
#   python -m uv sync --group train
# The source below pins the CPU wheel; for CUDA see docs/training.md.
train = [
    "torch>=2.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    "node_modules",
    "vendor",
    "__pycache__",
    "pytest-cache-files-*",
]
